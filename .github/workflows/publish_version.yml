name: Update Version JSON

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version.json with Changelog
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          VERSION=${TAG_NAME#v}
          DATE=$(date +'%Y-%m-%d')
          
          mkdir -p public/models
          mkdir -p public/plugins
          if [ -f "plugins/plugins_manifest.json" ]; then
            cp plugins/plugins_manifest.json public/
            cp plugins/plugins_manifest.json public/plugins/
          fi
          
          # Package independent SR models to public/models/*.zip for CDN download
          if [ -d "plugins/sr/sr_ncnn_vulkan/models" ]; then
            echo "Packaging independent SR models for GitHub Pages CDN..."
            for param_file in plugins/sr/sr_ncnn_vulkan/models/*.param; do
              if [ -f "$param_file" ]; then
                base_name=$(basename "$param_file" .param)
                bin_file="plugins/sr/sr_ncnn_vulkan/models/${base_name}.bin"
                if [ -f "$bin_file" ]; then
                  zip -j -9 "public/models/${base_name}.zip" "$param_file" "$bin_file"
                  echo "Created public/models/${base_name}.zip"
                fi
              fi
            done
          fi
          
          # 1. Get all assets in JSON
          ASSETS=$(gh release view "$TAG_NAME" --json assets -q '.assets')
          
          # 2. Identify ARM64 portable asset (QuickView .zip only, exclude installer .exe and plugins)
          URL_ARM64=$(echo "$ASSETS" | jq -r 'map(select(.name | ascii_downcase | (contains("quickview") and contains("arm64") and test("\\.zip$")))) | .[0].url // ""')
          NAME_ARM64=$(echo "$ASSETS" | jq -r 'map(select(.name | ascii_downcase | (contains("quickview") and contains("arm64") and test("\\.zip$")))) | .[0].name // ""')
          
          # 3. Identify X64/AMD64 portable asset (QuickView .zip only, exclude installer .exe and plugins)
          URL_X64=$(echo "$ASSETS" | jq -r 'map(select(.name | ascii_downcase | (contains("quickview") and (contains("x64") or contains("amd64")) and test("\\.zip$")))) | .[0].url // ""')
          NAME_X64=$(echo "$ASSETS" | jq -r 'map(select(.name | ascii_downcase | (contains("quickview") and (contains("x64") or contains("amd64")) and test("\\.zip$")))) | .[0].name // ""')
          
          # Fallback: if no explicit x64 .zip found, take the first QuickView .zip that isn't ARM64
          if [ -z "$URL_X64" ]; then
             URL_X64=$(echo "$ASSETS" | jq -r 'map(select((.name | ascii_downcase | (contains("quickview") and (contains("arm64") | not) and test("\\.zip$"))))) | .[0].url // ""')
             NAME_X64=$(echo "$ASSETS" | jq -r 'map(select((.name | ascii_downcase | (contains("quickview") and (contains("arm64") | not) and test("\\.zip$"))))) | .[0].name // ""')
          fi
          
          SHA_X64=""
          SHA_ARM64=""
          
          # Download and Hash X64
          if [ -n "$NAME_X64" ]; then
             gh release download "$TAG_NAME" -p "$NAME_X64" -O x64_pkg
             SHA_X64=$(sha256sum x64_pkg | awk '{print $1}')
          fi
          
          # Download and Hash ARM64
          if [ -n "$NAME_ARM64" ]; then
             gh release download "$TAG_NAME" -p "$NAME_ARM64" -O arm64_pkg
             SHA_ARM64=$(sha256sum arm64_pkg | awk '{print $1}')
          fi
          
          # Sync plugin zip packages from Release to public/plugins/
          for p_arch in "AMD64" "ARM64"; do
            P_NAME=$(echo "$ASSETS" | jq -r --arg a "$p_arch" 'map(select(.name | ascii_downcase | (contains("sr_ncnn_vulkan") and contains($a | ascii_downcase) and test("\\.zip$")))) | .[0].name // ""')
            if [ -n "$P_NAME" ] && [ "$P_NAME" != "null" ]; then
              echo "Syncing plugin package $P_NAME to public/plugins/..."
              gh release download "$TAG_NAME" -p "$P_NAME" -O "public/plugins/${P_NAME}" || true
            fi
          done
          
          # Fallback URL for legacy clients (pointing to X64)
          URL=$URL_X64
          
          IS_PRERELEASE="${{ github.event.release.prerelease }}"
          
          JSON_DATA=$(jq -n \
            --arg v "$VERSION" \
            --arg u "$URL" \
            --arg u_x64 "$URL_X64" \
            --arg u_arm "$URL_ARM64" \
            --arg sha_x64 "$SHA_X64" \
            --arg sha_arm "$SHA_ARM64" \
            --arg d "$DATE" \
            --arg c "$RELEASE_BODY" \
            '{version: $v, url: $u, url_x64: $u_x64, url_arm64: $u_arm, sha256_x64: $sha_x64, sha256_arm64: $sha_arm, date: $d, changelog: $c}')
          
          # $1 > $2 using Debian/Ubuntu sort -V (dotted numeric versions).
          version_gt() {
            local a="${1#v}" b="${2#v}"
            [ -z "$b" ] && return 0
            [ "$a" = "$b" ] && return 1
            [ "$(printf '%s\n%s\n' "$a" "$b" | sort -V | tail -n1)" = "$a" ]
          }
          
          # Current pre-release channel version on gh-pages (empty if missing).
          PRE_VERSION=""
          if git fetch origin gh-pages --depth=1; then
            PRE_VERSION=$(git show origin/gh-pages:version-prerelease.json 2>/dev/null | jq -r '.version // empty' || true)
          fi
          echo "Current pre-release channel version: '${PRE_VERSION:-<none>}'"
          
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "$JSON_DATA" > public/version-prerelease.json
            echo "=== Generated Pre-release JSON Content ==="
            cat public/version-prerelease.json
          else
            echo "$JSON_DATA" > public/version.json
            echo "=== Generated Stable JSON Content ==="
            cat public/version.json
            # Promote stable onto the pre-release channel only when it is newer
            # than the channel's current version (do not clobber a newer preview).
            if version_gt "$VERSION" "$PRE_VERSION"; then
              echo "$JSON_DATA" > public/version-prerelease.json
              echo "Stable $VERSION > pre-release '${PRE_VERSION:-<none>}' — also updated version-prerelease.json"
            else
              echo "Stable $VERSION is not greater than pre-release '$PRE_VERSION' — left version-prerelease.json unchanged"
            fi
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: false 
          keep_files: true
          publish_branch: gh-pages
          commit_message: "Auto-update version.json to ${{ github.event.release.tag_name }}"
name: QuickView Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allow manual trigger

jobs:
  build-and-release:
    name: Build & Pack (${{ matrix.platform }})
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - platform: x64
            preset: Release-LTO
          - platform: ARM64
            preset: ARM64-Release-LTO
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-archives

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Note: Visual Studio on GitHub Actions runner already includes matched LLVM/Clang-cl/lld-link

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Restore vcpkg Cache
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            out/build/${{ matrix.preset }}/vcpkg_installed
            ${{ github.workspace }}/third_party/vcpkg/installed
            ${{ github.workspace }}/vcpkg-archives
          key: vcpkg-${{ matrix.platform }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.platform }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}"
          cd third_party/vcpkg
          if (-not (Test-Path "vcpkg.exe")) {
            ./bootstrap-vcpkg.bat
          }

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }} -DVCPKG_MANIFEST_INSTALL=ON

      - name: Build Project
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Prepare Portable Version
        shell: pwsh
        run: |
          $archUpper = if ("${{ matrix.platform }}" -eq "x64") { "AMD64" } else { "ARM64" }
          
          # Path for CMake build artifact (Ninja puts it in root)
          $exePath = "${{ github.workspace }}/out/build/${{ matrix.preset }}/QuickView.exe"
          if (-not (Test-Path $exePath)) { Write-Error "EXE not found at $exePath"; exit 1 }
          
          # Extract version
          $rawVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exePath).ProductVersion
          $tag = if ($rawVersion -like "v*") { $rawVersion } else { "v$rawVersion" }
          
          # Trim .0
          if ($tag -match '^v\d+\.\d+\.\d+\.0$') {
              $tag = $tag.Substring(0, $tag.LastIndexOf('.'))
          }
          
          echo "DETECTED_TAG=$tag" >> $env:GITHUB_ENV
          
          # Prepare dist
          New-Item -ItemType Directory -Force "Release/dist"
          $zipName = "QuickView_${tag}_${archUpper}.zip"
          Compress-Archive -Path $exePath -DestinationPath "Release/dist/$zipName" -Force

          # Package standalone QVX plugin artifact (sr_ncnn_vulkan + models)
          $pluginDir = "${{ github.workspace }}/out/build/${{ matrix.preset }}/plugins/sr/sr_ncnn_vulkan"
          Write-Host "[CI-Package] Checking plugin directory: $pluginDir"
          if (Test-Path "$pluginDir/sr_ncnn_vulkan.qvx") {
              $pluginZip = "Release/dist/sr_ncnn_vulkan_${archUpper}.zip"
              Write-Host "[CI-Package] Packaging plugin $pluginDir -> $pluginZip"
              Compress-Archive -Path "$pluginDir/*" -DestinationPath $pluginZip -Force
              if ("${{ matrix.platform }}" -eq "x64") {
                  Copy-Item -Path "${{ github.workspace }}/plugins/plugins_manifest.json" -Destination "Release/dist/plugins_manifest.json" -Force
              }
          } else {
              Write-Warning "[CI-Package] Warning: sr_ncnn_vulkan.qvx not found at $pluginDir!"
          }

          Write-Host "[CI-Package] Staging contents in Release/dist:"
          Get-ChildItem "Release/dist" | Format-Table Name, Length

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $arch = "${{ matrix.platform }}".ToLower()
          $archUpper = if ("${{ matrix.platform }}" -eq "x64") { "AMD64" } else { "ARM64" }
          $tag = "${{ env.DETECTED_TAG }}"
          $version = $tag.TrimStart('v')
          
          # CRITICAL FIX: Use absolute path for ExePath to prevent Inno Setup relative path confusion
          $absExePath = "${{ github.workspace }}/out/build/${{ matrix.preset }}/QuickView.exe"
          $outputName = "QuickView_Installer_${tag}_${archUpper}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version /DAppArch=$arch /DOutputName=$outputName /DExePath="$absExePath" /O"Release\dist" installer\QuickView.iss

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickView-Staging-${{ matrix.platform }}
          path: Release/dist/*

  publish-final:
    needs: build-and-release
    runs-on: windows-2025-vs2026
    name: Consolidate & Release
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: QuickView-Staging-*
          path: final-dist
          merge-multiple: true

      - name: List Release Assets
        shell: pwsh
        run: |
          Write-Host "[CI-Release] Final release assets in final-dist:"
          Get-ChildItem -Path final-dist -Recurse | Format-Table Name, Length, FullName

      - name: Upload Consolidated Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickView-Standard-Distribution
          path: final-dist/*

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            final-dist/*.zip
            final-dist/*.exe
            final-dist/*.json
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
